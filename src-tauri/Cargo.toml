[package]
name = "verbalix"
version = "0.1.0"
description = "Technical writing companion for macOS"
authors = ["Verbalix"]
edition = "2021"

[lib]
name = "verbalix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
async-trait = "0.1.89"
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.11.3", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2.3.1"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["sync", "time"] }
uuid = { version = "1.23.0", features = ["v4", "serde"] }
keyring = { version = "3.6.3", features = ["apple-native"] }
arboard = "3.6.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.1", features = ["NSApplication", "NSPasteboard"] }
objc2-foundation = { version = "0.3.1", features = ["NSString"] }

[dev-dependencies]
tempfile = "3.23.0"
