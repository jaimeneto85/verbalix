name: Verbalix

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  xcodeVersion: "16.0"
  defaultConfig: Debug

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  VerbalixKit:
    path: VerbalixKit

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Verbalix:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    info:
      path: Verbalix/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.verbalix.ios
            CFBundleURLSchemes:
              - verbalix-ios
        VerbalixSupabaseURL: $(VerbalixSupabaseURL)
        VerbalixSupabaseAnonKey: $(VerbalixSupabaseAnonKey)
        UILaunchScreen: {}
        CFBundleDisplayName: Verbalix
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Verbalix/Verbalix.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.verbalix.shared
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.verbalix.shared
    sources:
      - path: Verbalix
        excludes:
          - Info.plist
          - Verbalix.entitlements
    dependencies:
      - package: VerbalixKit
      - target: VerbalixAction
        embed: true
        codeSign: false
      - target: VerbalixKeyboard
        embed: true
        codeSign: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.verbalix.ios
        INFOPLIST_FILE: Verbalix/Info.plist
        CODE_SIGN_ENTITLEMENTS: Verbalix/Verbalix.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  VerbalixAction:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    info:
      path: VerbalixAction/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Verbalix
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ui-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ActionViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
        VerbalixSupabaseURL: $(VerbalixSupabaseURL)
        VerbalixSupabaseAnonKey: $(VerbalixSupabaseAnonKey)
    entitlements:
      path: VerbalixAction/VerbalixAction.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.verbalix.shared
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.verbalix.shared
    sources:
      - path: VerbalixAction
        excludes:
          - Info.plist
          - VerbalixAction.entitlements
    dependencies:
      - package: VerbalixKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.verbalix.ios.action
        INFOPLIST_FILE: VerbalixAction/Info.plist
        CODE_SIGN_ENTITLEMENTS: VerbalixAction/VerbalixAction.entitlements

  VerbalixKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    info:
      path: VerbalixKeyboard/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Verbalix
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
        VerbalixSupabaseURL: $(VerbalixSupabaseURL)
        VerbalixSupabaseAnonKey: $(VerbalixSupabaseAnonKey)
    entitlements:
      path: VerbalixKeyboard/VerbalixKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.verbalix.shared
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.verbalix.shared
    sources:
      - path: VerbalixKeyboard
        excludes:
          - Info.plist
          - VerbalixKeyboard.entitlements
    dependencies:
      - package: VerbalixKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.verbalix.ios.keyboard
        INFOPLIST_FILE: VerbalixKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: VerbalixKeyboard/VerbalixKeyboard.entitlements
